apply from: "$rootDir/dependencies.gradle"
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'
apply plugin: 'koin'
apply plugin: 'com.google.gms.google-services'

ext.majorVersion = 1
ext.minorVersion = 4
ext.patchVersion = 0
ext.preRelease = ""

//if (new File('sign.gradle').exists()) {
    apply from: '../sign.gradle'
//}

android {
    compileSdkVersion 33
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.icaali.tasbeeh"
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion
        versionCode generateVersionCode()
        versionName generateVersionName()
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            testCoverageEnabled = true
            minifyEnabled false
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            zipAlignEnabled true
            shrinkResources true
            crunchPngs true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "env"
    productFlavors {
        production {
            dimension "env"
            applicationId "com.icaali.tasbeeh"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Tasbeeh-${generateVersionName()}-${variant.flavorName}-${variant.buildType.name}.apk"
        }
    }
}

androidExtensions {
    experimental = true
}

apply from: '../variant_filter.gradle'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.core:core-ktx:1.2.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation group: 'org.jacoco', name: 'org.jacoco.agent', version: '0.7.9'

    //Android Support Dependencies
    implementation supportDependencies.appCompat
    implementation supportDependencies.coreKotlin
    implementation supportDependencies.coroutinesCoreKotlin
    implementation supportDependencies.design
    implementation supportDependencies.cardView
    implementation libraries.multidex
    implementation libraries.anko
    implementation libraries.ankoCommon
    implementation libraries.gson

    //Ads
    implementation libraries.playServiceAds

    //Dependency Injection
    implementation libraries.koinCore
    implementation libraries.koinCoreExt
    implementation libraries.koinFragment
    implementation libraries.koinWorkManager
//    implementation libraries.koinWorkCompose
    implementation libraries.koinWorkManager
    implementation libraries.koinScope
    implementation libraries.koinViewModel
    implementation libraries.koinAndroidExt

    //Rx
    implementation libraries.rxJava2
    implementation libraries.rxAndroid2
    implementation libraries.rxBindingPlatform
    implementation libraries.rxBindingAppCompat
    implementation libraries.rxBindingSupport
    implementation libraries.rxBindingAppCompatKotlin
    implementation libraries.rxBindingPlatformKotlin
    implementation libraries.rxBindingSupportKotlin

    // Import the BoM for the Firebase platform
    implementation platform('com.google.firebase:firebase-bom:29.3.0')
    // Declare the dependency for the Analytics library
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-analytics'
    //Firebase
    implementation 'com.google.firebase:firebase-config:21.0.1'
    implementation 'com.google.firebase:firebase-database:20.0.3'
    implementation 'com.google.firebase:firebase-core:20.1.0'
    implementation 'com.google.firebase:firebase-crashlytics:18.2.8'

    //Glide
    implementation libraries.glide

    //ViewAnimator
    implementation 'com.github.florent37:viewanimator:1.1.0'

    // Room components
    implementation "androidx.room:room-ktx:2.4.3"
    kapt "androidx.room:room-compiler:2.4.3"
    androidTestImplementation "androidx.room:room-testing:2.4.3"

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.4.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.4.0"

    // Kotlin components
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.3.70"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.4.1"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.1"

    // UI
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "com.google.android.material:material:1.6.0"
//    implementation 'com.google.android.material:material:1.6.0'
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    // Tap target view
    implementation 'uk.co.samuelwall:material-tap-target-prompt:3.3.2'

    // Testing
    testImplementation "junit:junit:4.12"
    androidTestImplementation "androidx.arch.core:core-testing:2.1.0"
    androidTestImplementation ("androidx.test.espresso:espresso-core:1.0.0", {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    androidTestImplementation "androidx.test.ext:junit:1.1.3"

    implementation 'androidx.work:work-runtime-ktx:2.7.0'
}

private Integer generateVersionCode() {
    return project.ext.minSdkVersion * 10000000 + ext.majorVersion * 10000 + ext.minorVersion * 100 + ext.patchVersion
}

private String generateVersionName() {
    String versionName = "${ext.majorVersion}.${ext.minorVersion}.${ext.patchVersion}"
    return versionName
}

apply plugin: 'com.google.firebase.crashlytics'