plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
    id("com.google.firebase.crashlytics")
    id 'com.google.gms.google-services'
}

ext.majorVersion = 1
ext.minorVersion = 0
ext.patchVersion = 9
ext.preRelease = ""

apply from: '../sign.gradle'
apply from: "../dependencies.gradle"
apply from: '../variant_filter.gradle'

ext {
    minSdkVersion = 24
    targetSdkVersion = 34
    compileSdkVersion = 34
}

android {
    compileSdk = 34
    defaultConfig {
        applicationId "com.app_muslim.surah_yasin"
        minSdk project.ext.minSdkVersion
        targetSdk project.ext.targetSdkVersion
        versionCode generateVersionCode()
        versionName generateVersionName()
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            testCoverageEnabled = true
            minifyEnabled false
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            crunchPngs true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        compose true
        buildConfig true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }
    flavorDimensions "env"
    productFlavors {
        production {
            dimension "env"
            applicationId "com.app_muslim.surah_yasin"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
            vendor = JvmVendorSpec.ADOPTIUM
        }
    }

    hilt {
        enableAggregatingTask = true
    }
    
    // Configure annotation processors to ignore unrecognized options
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:-processing']
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Yasin-${generateVersionName()}-${variant.flavorName}-${variant.buildType.name}.apk"
        }
    }
    namespace 'com.app_muslim.surah_yasin'
}

apply from: '../variant_filter.gradle'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation group: 'org.jacoco', name: 'org.jacoco.agent', version: '0.8.8'

    // Feature modules
    implementation project(':core:core-common')
    implementation project(':core:core-firebase')
    implementation project(':core:core-ui')
    implementation project(':feature:feature-auth')
    implementation project(':feature:feature-memorial-prayer')
    implementation project(':feature:feature-profile')

    //Android Support Dependencies
    implementation supportDependencies.appCompat
    implementation supportDependencies.coreKotlin
    implementation supportDependencies.coroutinesCoreKotlin
    implementation supportDependencies.design
    implementation supportDependencies.cardView
    implementation libraries.multidex
    implementation libraries.gson

    //Ads
    implementation("com.google.android.gms:play-services-ads:23.3.0")


    // Jetpack Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.foundation:foundation-layout'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    
    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    
    //Dependency Injection (Hilt)
    implementation 'com.google.dagger:hilt-android:2.50'
    ksp 'com.google.dagger:hilt-compiler:2.50'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'

    //Rx
    implementation libraries.rxJava2
    implementation libraries.rxAndroid2
    implementation libraries.rxBindingPlatform
    implementation libraries.rxBindingAppCompat
    implementation libraries.rxBindingSupport
    implementation libraries.rxBindingAppCompatKotlin
    implementation libraries.rxBindingPlatformKotlin
    implementation libraries.rxBindingSupportKotlin

    //Glide
    implementation libraries.glide

    //Architecture Component
    implementation("androidx.room:room-runtime:2.6.1")
    implementation "android.arch.persistence.room:rxjava2:1.1.1"
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp "androidx.room:room-compiler:2.6.1"

    implementation "android.arch.lifecycle:extensions:1.1.1"
    implementation "android.arch.lifecycle:compiler:1.1.1"
    implementation "androidx.paging:paging-runtime:3.2.1"

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.4"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.8.4"

    // Kotlin components
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.3.70"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.4.1"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.1"

    // UI (Keep existing for gradual migration)
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // Compose Testing
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Tap target view
    implementation 'uk.co.samuelwall:material-tap-target-prompt:3.3.2'

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"
    androidTestImplementation("androidx.test.espresso:espresso-core:1.0.0", {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    androidTestImplementation "androidx.test.ext:junit:1.1.5"

    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Import the BoM for the Firebase platform (Latest 2026)
    implementation(platform("com.google.firebase:firebase-bom:33.1.2"))
    
    // Complete Firebase Ecosystem Integration
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-config")
    
    // Firebase Authentication (Multi-provider)
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.android.gms:play-services-auth:21.2.0") // Google Sign-In
    
    // Cloud Firestore (NoSQL Database)
    implementation("com.google.firebase:firebase-firestore")
    
    // Cloud Storage for Firebase
    implementation("com.google.firebase:firebase-storage")
    
    // Cloud Functions for Firebase
    implementation("com.google.firebase:firebase-functions")
    
    // Firebase Cloud Messaging
    implementation("com.google.firebase:firebase-messaging")
    
    // Firebase Performance Monitoring
    implementation("com.google.firebase:firebase-perf")
    
    // Firebase App Check (Anti-abuse)
    implementation("com.google.firebase:firebase-appcheck-playintegrity")
    
    // Firebase In-App Messaging
    implementation("com.google.firebase:firebase-inappmessaging-display")
    
    // Firebase Dynamic Links (for memorial sharing)
    implementation("com.google.firebase:firebase-dynamic-links")
    
    
    // Remove deprecated Realtime Database, replace with Firestore
    // implementation("com.google.firebase:firebase-database") // REMOVED - Using Firestore instead
    
    implementation("com.google.android.play:review-ktx:2.0.2")

    //Expandable Layout
    implementation "com.github.skydoves:expandablelayout:1.0.7"
    //Circular ImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    //Event Bus
    implementation "org.greenrobot:eventbus:3.3.1"
}

private Integer generateVersionCode() {
    return project.ext.minSdkVersion * 10000000 + ext.majorVersion * 10000 + ext.minorVersion * 100 + ext.patchVersion
}

private String generateVersionName() {
    String versionName = "${ext.majorVersion}.${ext.minorVersion}.${ext.patchVersion}"
    return versionName
}

apply plugin: 'com.google.firebase.crashlytics'