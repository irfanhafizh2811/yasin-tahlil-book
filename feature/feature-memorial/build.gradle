plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'dagger.hilt.android.plugin'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}

android {
    compileSdk 34
    
    defaultConfig {
        minSdk 24
        targetSdk 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    buildFeatures {
        compose = true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }
    
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    hilt {
        enableAggregatingTask = true
    }
    
    namespace 'com.app_muslim.surah_yasin.feature.memorial'
}

dependencies {
    implementation project(':core:core-common')
    implementation project(':core:core-ui')
    implementation project(':core:core-firebase')
    
    // Jetpack Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.foundation:foundation-layout'
    implementation 'androidx.compose.foundation:foundation-layout-android'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    
    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    
    // Hilt
    implementation 'com.google.dagger:hilt-android:2.50'
    ksp 'com.google.dagger:hilt-compiler:2.50'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'
    
    // Firebase
    implementation platform("com.google.firebase:firebase-bom:33.1.2")
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-firestore")
    implementation("com.google.firebase:firebase-storage")
    
    // Date and time for Hijri calendar
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.6'
    
    // CameraX for photo capture
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"
    implementation "androidx.camera:camera-extensions:1.3.1"
    
    // Image loading and processing
    implementation "io.coil-kt:coil-compose:2.5.0"
    implementation "io.coil-kt:coil-svg:2.5.0"
    
    // Photo picker and gallery
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.activity:activity-ktx:1.8.2"
    
    // Image manipulation and cropping
    implementation "com.github.yalantis:ucrop:2.2.8"
    implementation "androidx.exifinterface:exifinterface:1.3.6"
    
    // Permissions handling
    implementation "com.google.accompanist:accompanist-permissions:0.32.0"
    
    // CameraX additional dependencies
    implementation "androidx.camera:camera-core:1.3.1"
    implementation "androidx.concurrent:concurrent-futures-ktx:1.1.0"
    implementation "com.google.guava:guava:31.1-android"
    
    // Canvas and graphics
    implementation "androidx.compose.ui:ui-graphics"
    
    // Preferences DataStore
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}