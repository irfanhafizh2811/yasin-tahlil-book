# 🚀 Tahlil Production Deployment Configuration
# Comprehensive deployment strategy for global Islamic memorial platform

apiVersion: deployment/v1
kind: ProductionDeployment
metadata:
  name: tahlil-global-memorial-platform
  version: "1.0.0"
  
spec:
  # Application Configuration
  application:
    name: "Tahlil Global Memorial Platform"
    package: "com.app_muslim.surah_yasin"
    version: "1.0.0"
    buildNumber: 1
    
    # Target environments
    environments:
      - name: "staging"
        description: "Pre-production testing environment"
        firebaseProject: "surah-almulk-staging"
        playStore: false
        
      - name: "production"
        description: "Global production environment"
        firebaseProject: "surah-almulk"
        playStore: true
        
      - name: "beta"
        description: "Beta testing with selected users"
        firebaseProject: "surah-almulk-beta"
        playStore: true
        playStoreBeta: true

  # Build Configuration
  build:
    android:
      compileSdk: 34
      minSdk: 24
      targetSdk: 34
      buildTools: "34.0.0"
      
      # Build variants
      variants:
        - name: "debug"
          applicationIdSuffix: ".debug"
          versionNameSuffix: "-debug"
          debuggable: true
          minifyEnabled: false
          
        - name: "staging"
          applicationIdSuffix: ".staging"
          versionNameSuffix: "-staging"
          debuggable: false
          minifyEnabled: true
          shrinkResources: true
          
        - name: "production"
          debuggable: false
          minifyEnabled: true
          shrinkResources: true
          zipAlignEnabled: true
          
      # Signing configuration
      signing:
        debug:
          storeFile: "debug.keystore"
          storePassword: "android"
          keyAlias: "androiddebugkey"
          keyPassword: "android"
          
        release:
          storeFile: "${ANDROID_KEYSTORE_FILE}"
          storePassword: "${ANDROID_KEYSTORE_PASSWORD}"
          keyAlias: "${ANDROID_KEY_ALIAS}"
          keyPassword: "${ANDROID_KEY_PASSWORD}"

  # Firebase Configuration
  firebase:
    # Staging environment
    staging:
      projectId: "surah-almulk-staging"
      services:
        - firestore
        - storage
        - auth
        - functions
        - analytics
        - crashlytics
        - performance
        - remoteconfig
        - messaging
      
      # Environment-specific settings
      settings:
        analytics:
          enabled: true
          debugMode: true
        crashlytics:
          enabled: true
          mappingFileUpload: true
        performance:
          enabled: true
          samplingRate: 1.0
          
    # Production environment  
    production:
      projectId: "surah-almulk"
      services:
        - firestore
        - storage
        - auth
        - functions
        - analytics
        - crashlytics
        - performance
        - remoteconfig
        - messaging
        - appcheck
        
      # Production-optimized settings
      settings:
        analytics:
          enabled: true
          debugMode: false
          automaticDataCollection: true
        crashlytics:
          enabled: true
          mappingFileUpload: true
        performance:
          enabled: true
          samplingRate: 0.1
        appcheck:
          enabled: true
          provider: "playintegrity"

  # Deployment Strategy
  deployment:
    # Staging deployment
    staging:
      trigger:
        branches: ["develop", "staging"]
        onPullRequest: true
        
      steps:
        - name: "build"
          action: "./gradlew assembleStaging"
          
        - name: "test"
          action: "./gradlew testStagingUnitTest"
          
        - name: "firebase-deploy"
          action: "firebase deploy --only functions,firestore:rules,storage:rules"
          
        - name: "distribute"
          action: "firebase appdistribution:distribute"
          groups: ["internal-testers", "qa-team"]
          
    # Production deployment
    production:
      trigger:
        branches: ["master"]
        tags: ["v*"]
        manual: true
        
      approvals:
        required: true
        approvers:
          - "team-lead"
          - "security-engineer"
          - "cultural-validator"
          
      preDeployment:
        - name: "quality-gates"
          action: "./scripts/quality-gates.sh"
          
        - name: "security-scan"
          action: "./scripts/security-scan.sh"
          
        - name: "cultural-validation"
          action: "./scripts/cultural-validation.sh"
          
      deployment:
        - name: "build-production"
          action: "./gradlew assembleRelease bundleRelease"
          
        - name: "test-production"
          action: "./gradlew testReleaseUnitTest"
          
        - name: "firebase-deploy"
          action: "firebase deploy --project=surah-almulk"
          
        - name: "playstore-upload"
          action: "fastlane supply --track production"
          
      postDeployment:
        - name: "smoke-tests"
          action: "./scripts/production-smoke-tests.sh"
          
        - name: "monitoring-setup"
          action: "./scripts/setup-monitoring.sh"
          
        - name: "notification"
          action: "slack-notify success"

  # Scaling Configuration
  scaling:
    # Firebase scaling
    firebase:
      firestore:
        # Automatic scaling based on usage
        reads:
          dailyLimit: 1000000
          alertThreshold: 800000
          
        writes:
          dailyLimit: 200000
          alertThreshold: 160000
          
      storage:
        uploadLimit: "10GB"
        downloadLimit: "100GB"
        
      functions:
        concurrency: 1000
        memory: "1GB"
        timeout: "540s"
        
    # CDN configuration for global reach
    cdn:
      provider: "cloudflare"
      regions:
        - "asia-southeast"    # Indonesia, Malaysia, Singapore
        - "middle-east"       # Saudi Arabia, UAE, Egypt
        - "south-asia"        # Pakistan, Bangladesh, India
        - "europe-west"       # UK, Germany, France
        - "north-america"     # US, Canada
        
    # Monitoring and alerting
    monitoring:
      uptime:
        threshold: 99.9
        alertChannels: ["slack", "email", "sms"]
        
      performance:
        responseTime: "<500ms"
        errorRate: "<0.1%"
        
      usage:
        dailyActiveUsers: "monitor"
        memorialCreations: "monitor"
        prayerSubmissions: "monitor"

  # Security Configuration
  security:
    # App signing
    appSigning:
      playAppSigning: true
      keyRotation: "annual"
      
    # API security
    apiSecurity:
      authentication: "required"
      rateLimiting:
        enabled: true
        limits:
          memorial: "10/hour"
          prayer: "1000/hour"
          sharing: "50/hour"
          
    # Data protection
    dataProtection:
      encryption:
        atRest: true
        inTransit: true
        
      backup:
        frequency: "daily"
        retention: "90days"
        crossRegion: true
        
    # Compliance
    compliance:
      gdpr: true
      coppa: true
      islamicPrivacy: true

  # Rollback Strategy
  rollback:
    # Automated rollback triggers
    triggers:
      - crashRate: ">1%"
      - errorRate: ">0.5%"
      - userRating: "<4.0"
      - performanceRegression: ">20%"
      
    # Rollback procedures
    procedures:
      immediate:
        - name: "revert-firebase-rules"
          action: "firebase deploy --only firestore:rules,storage:rules --project previous-version"
          
        - name: "rollback-functions"
          action: "firebase functions:delete --force && firebase deploy --only functions --project previous-version"
          
      playstore:
        - name: "halt-rollout"
          action: "fastlane supply --halt_rollout"
          
        - name: "promote-previous"
          action: "fastlane supply --track production --rollout 100"

  # Performance Optimization
  performance:
    # APK optimization
    apk:
      proguard: true
      r8: true
      zipAlign: true
      
      # App bundle configuration
      bundleConfig:
        uncompressedNativeLibs: false
        compressionLevel: 9
        
    # Runtime optimization
    runtime:
      artProfile: true
      baselineProfile: true
      
    # Network optimization
    network:
      connectionPooling: true
      caching: "aggressive"
      compression: true

  # Analytics and Monitoring
  analytics:
    # Firebase Analytics
    firebase:
      automaticEvents: true
      customEvents:
        - "memorial_created"
        - "prayer_submitted" 
        - "family_invited"
        - "memorial_shared"
        
    # Performance monitoring
    performance:
      screenTracking: true
      networkRequestTracking: true
      customTraces:
        - "memorial_creation_time"
        - "prayer_submission_time"
        - "photo_upload_time"
        
    # Cultural analytics
    cultural:
      languageUsage: true
      regionalPreferences: true
      prayerTypePopularity: true
      culturalFeatureAdoption: true

  # Disaster Recovery
  disasterRecovery:
    # Backup strategy
    backup:
      firestore:
        frequency: "daily"
        retention: "1year"
        crossRegion: true
        
      storage:
        frequency: "daily"
        retention: "1year"
        versioning: true
        
    # Recovery procedures
    recovery:
      rto: "4hours"  # Recovery Time Objective
      rpo: "1hour"   # Recovery Point Objective
      
      procedures:
        - name: "data-restore"
          steps:
            - "Activate standby Firebase project"
            - "Restore Firestore from backup"
            - "Restore Storage from backup"
            - "Update DNS records"
            - "Verify application functionality"
            
        - name: "partial-outage"
          steps:
            - "Enable offline mode"
            - "Cache critical data locally"
            - "Queue operations for sync"
            - "Notify users of degraded service"

  # Support and Maintenance
  maintenance:
    # Regular maintenance windows
    windows:
      - day: "Sunday"
        time: "02:00-04:00 UTC"
        description: "Weekly maintenance"
        
    # Update strategy
    updates:
      security: "immediate"
      features: "monthly"
      dependencies: "quarterly"
      
    # Support tiers
    support:
      tier1: "24/7 critical issues"
      tier2: "business hours general support"
      tier3: "community forum support"