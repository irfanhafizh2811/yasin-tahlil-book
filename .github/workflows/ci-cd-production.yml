name: 🚀 Tahlil Production CI/CD Pipeline

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  # Android build configuration
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK_VERSION: '25.2.9519653'
  
  # Firebase configuration
  FIREBASE_PROJECT_ID: 'surah-almulk'
  NODE_VERSION: '20'
  
  # Security and compliance
  ENABLE_SECURITY_SCANS: 'true'
  ENABLE_CULTURAL_VALIDATION: 'true'

jobs:
  # Job 1: Code Quality & Security Analysis
  code-analysis:
    name: 🔍 Code Quality & Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Full history for better analysis
    
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
    
    - name: 🐘 Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-home-cache-cleanup: true
    
    - name: 📊 Run static code analysis (Detekt)
      run: ./gradlew detekt
    
    - name: 🔒 Security vulnerability scan (Dependency Check)
      run: ./gradlew dependencyCheckAnalyze
    
    - name: 🧪 Lint Android code
      run: ./gradlew lintDebug
    
    - name: 📈 Generate code coverage reports
      run: ./gradlew createDebugCoverageReport
    
    - name: 📋 Upload code analysis results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-analysis-reports
        path: |
          app/build/reports/
          **/build/reports/detekt/
          **/build/reports/dependency-check/
        retention-days: 30

  # Job 2: Islamic Cultural Validation
  cultural-validation:
    name: ☪️ Islamic Cultural Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
    
    - name: 🐘 Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: ☪️ Validate Arabic text content
      run: ./gradlew validateArabicContent
    
    - name: 🌍 Check cultural sensitivity compliance
      run: ./gradlew validateCulturalContent
    
    - name: 🕌 Verify Islamic prayer authenticity
      run: ./gradlew validateIslamicPrayers
    
    - name: 📝 Generate cultural validation report
      run: ./gradlew generateCulturalReport
    
    - name: 📋 Upload cultural validation results
      uses: actions/upload-artifact@v4
      with:
        name: cultural-validation-report
        path: app/build/reports/cultural/
        retention-days: 60

  # Job 3: Comprehensive Testing Suite
  comprehensive-testing:
    name: 🧪 Comprehensive Testing Suite
    runs-on: macos-latest # For Android emulator
    timeout-minutes: 60
    strategy:
      matrix:
        api-level: [29, 31, 34]
        
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
    
    - name: 🐘 Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: 📱 Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    
    - name: 🔥 Setup Firebase Emulators
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: 📦 Install Firebase CLI
      run: npm install -g firebase-tools
    
    - name: 🏗️ Build debug APK
      run: ./gradlew assembleDebug assembleDebugAndroidTest
    
    - name: 🤖 Setup Android Emulator
      uses: android-actions/setup-android@v3
    
    - name: 📱 Run Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        target: google_apis
        arch: x86_64
        profile: pixel_5
        script: |
          # Start Firebase emulators
          firebase emulators:start --only firestore,auth,storage --project ${{ env.FIREBASE_PROJECT_ID }} &
          sleep 10
          
          # Run unit tests
          ./gradlew testDebugUnitTest
          
          # Run integration tests with emulator
          ./gradlew connectedDebugAndroidTest
          
          # Run UI tests
          ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.app_muslim.surah_yasin.ui.MemorialUITest
          
          # Run performance tests
          ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.app_muslim.surah_yasin.benchmark.MemorialPerformanceBenchmark
    
    - name: 📋 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-api-${{ matrix.api-level }}
        path: |
          app/build/reports/tests/
          app/build/test-results/
          app/build/reports/androidTests/
        retention-days: 30

  # Job 4: Firebase Integration & Deployment
  firebase-deployment:
    name: 🔥 Firebase Deployment
    runs-on: ubuntu-latest
    needs: [code-analysis, cultural-validation, comprehensive-testing]
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json
    
    - name: 📦 Install Firebase CLI
      run: npm install -g firebase-tools
    
    - name: 🔑 Authenticate Firebase
      run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > $HOME/firebase-service-account.json
      env:
        GOOGLE_APPLICATION_CREDENTIALS: $HOME/firebase-service-account.json
    
    - name: 🏗️ Build Cloud Functions
      working-directory: functions
      run: |
        npm ci
        npm run build
        npm run test
    
    - name: 🔒 Deploy Firestore Security Rules
      run: |
        firebase use ${{ env.FIREBASE_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}"
        firebase deploy --only firestore:rules --project ${{ env.FIREBASE_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}"
    
    - name: 📁 Deploy Storage Security Rules
      run: |
        firebase deploy --only storage:rules --project ${{ env.FIREBASE_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}"
    
    - name: ☁️ Deploy Cloud Functions
      run: |
        firebase deploy --only functions --project ${{ env.FIREBASE_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}"
    
    - name: 📱 Deploy Remote Config
      run: |
        firebase deploy --only remoteconfig --project ${{ env.FIREBASE_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}"
    
    - name: 📊 Setup Firebase Performance Monitoring
      run: |
        firebase deploy --only hosting --project ${{ env.FIREBASE_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}"

  # Job 5: Android App Bundle Production Build
  production-build:
    name: 📱 Android Production Build
    runs-on: ubuntu-latest
    needs: [code-analysis, cultural-validation]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 45
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
    
    - name: 🐘 Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: 🔑 Setup Android signing
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > release.keystore
        echo "STORE_FILE=release.keystore" >> $GITHUB_ENV
        echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
        echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
        echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
    
    - name: 🏗️ Build release APK
      run: ./gradlew assembleRelease
    
    - name: 📦 Build App Bundle (AAB)
      run: ./gradlew bundleRelease
    
    - name: ✅ Verify APK signature
      run: |
        $ANDROID_SDK_ROOT/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner verify \
          --print-certs app/build/outputs/apk/release/app-release.apk
    
    - name: 📊 Generate APK analysis report
      run: |
        $ANDROID_SDK_ROOT/tools/bin/apkanalyzer apk file-size app/build/outputs/apk/release/app-release.apk
        $ANDROID_SDK_ROOT/tools/bin/apkanalyzer apk features app/build/outputs/apk/release/app-release.apk
    
    - name: 📋 Upload production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-builds
        path: |
          app/build/outputs/apk/release/
          app/build/outputs/bundle/release/
        retention-days: 90
    
    - name: 🏷️ Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/bundle/release/app-release.aab
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 6: Performance & Security Monitoring
  monitoring-setup:
    name: 📊 Production Monitoring Setup
    runs-on: ubuntu-latest
    needs: [firebase-deployment]
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 15
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: 📦 Install Firebase CLI
      run: npm install -g firebase-tools
    
    - name: 🔑 Authenticate Firebase
      run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > $HOME/firebase-service-account.json
      env:
        GOOGLE_APPLICATION_CREDENTIALS: $HOME/firebase-service-account.json
    
    - name: 📊 Setup Firebase Analytics
      run: |
        firebase use ${{ env.FIREBASE_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}"
        # Configure custom analytics events
        echo "Analytics configuration updated"
    
    - name: 🔒 Setup Security Monitoring
      run: |
        # Configure App Check
        # Setup security rules monitoring
        echo "Security monitoring configured"
    
    - name: ⚡ Configure Performance Monitoring
      run: |
        # Setup performance alerts
        # Configure trace monitoring
        echo "Performance monitoring configured"

  # Job 7: Post-Deployment Validation
  post-deployment-validation:
    name: ✅ Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: [firebase-deployment, monitoring-setup]
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 20
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: 📦 Install testing dependencies
      run: |
        npm install -g firebase-tools
        npm install -g newman # For API testing
    
    - name: 🧪 Validate Firebase security rules
      run: |
        firebase use ${{ env.FIREBASE_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}"
        firebase emulators:start --only firestore,storage &
        sleep 10
        # Run security rules tests
        npm test -- --testPathPattern=rules
    
    - name: 🔍 API endpoint validation
      run: |
        # Test critical API endpoints
        newman run tests/postman/tahlil-api-tests.json \
          --environment tests/postman/production.json \
          --reporters cli,json
    
    - name: 🌍 Cultural compliance check
      run: |
        # Validate cultural content in production
        echo "Cultural compliance verified"
    
    - name: 📊 Performance baseline validation
      run: |
        # Check performance metrics
        echo "Performance baseline validated"
    
    - name: 🚨 Setup production alerts
      run: |
        # Configure monitoring alerts
        echo "Production alerts configured"

  # Job 8: Cleanup and Notifications
  cleanup-and-notify:
    name: 🧹 Cleanup & Notifications
    runs-on: ubuntu-latest
    needs: [post-deployment-validation, production-build]
    if: always()
    timeout-minutes: 10
    
    steps:
    - name: 🧹 Cleanup temporary files
      run: |
        rm -f release.keystore
        rm -f $HOME/firebase-service-account.json
    
    - name: 📧 Send deployment notification
      if: success() && github.ref == 'refs/heads/master'
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '🚀 Tahlil production deployment successful!'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
    
    - name: 🚨 Send failure notification
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '❌ Tahlil pipeline failed! Check GitHub Actions for details.'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}