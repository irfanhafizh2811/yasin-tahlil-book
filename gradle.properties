# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Combined with JDK compatibility fixes below
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Hilt configuration - Using modern Hilt 2.50 defaults
# Removed deprecated properties that caused annotation processor warnings

# Kotlin Symbol Processing (KSP) configuration
kapt.includeCompileClasspath=false

# Suppress annotation processor warnings for unrecognized options
# This addresses legacy configurations that may persist in cached builds
org.gradle.warning.mode=summary

# FORCE Java 17 - Override Android Studio JDK completely
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home


# JDK compatibility fixes - FORCE Java 17 compatibility + Fix heap issues + jlink fix
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED -Dfile.encoding=UTF-8

# Enable toolchain auto-provisioning to fix JDK issues
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.fromEnv=JAVA_HOME
org.gradle.java.installations.auto-detect=true

# Android build optimizations with Java 17 enforcement
android.compile.incremental=false
android.enableR8.fullMode=false
org.gradle.jvmargs.android=-Dorg.gradle.jvmargs="-Djava.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home"

# Android test optimizations to fix heap and dex issues
android.builder.sdkDownload=false
android.injected.testOnly=false
android.enableDexingArtifactTransform.desugaring=false

# Fix for jlink issues with Android Gradle Plugin  
android.enableJdkImageTransform=false
android.experimental.enableJdkImageTransform=false
android.forceJavaHome=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
android.experimental.testOptions.managedDevices.emulator.showKernelLogging=false